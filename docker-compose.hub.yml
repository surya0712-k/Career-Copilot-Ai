# Deploy pre-built images from Docker Hub (no build on server).
#
# On your machine: build & push  →  scripts/dockerhub-push.ps1 (or .sh)
# On EC2/VPS:      pull & run    →  docker compose -f docker-compose.hub.yml up -d
#
# Required in .env:
#   DOCKERHUB_USER=your-dockerhub-username
#   POSTGRES_PASSWORD=...
#   NEXT_PUBLIC_API_URL=http://YOUR_HOST:8002
#   GITHUB_REDIRECT_URI=http://YOUR_HOST:3001/auth/callback
#   (+ Azure, GitHub, JWT, LiveKit secrets)

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-career_copilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-career_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: ${DOCKERHUB_USER:?Set DOCKERHUB_USER in .env}/career-copilot-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8002:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-career_copilot}
      QDRANT_URL: http://qdrant:6333
      MCP_SERVER_URL: http://mcp-server:8080
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 2"

  mcp-server:
    image: ${DOCKERHUB_USER}/career-copilot-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-career_copilot}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  livekit-agent:
    image: ${DOCKERHUB_USER}/career-copilot-livekit-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LIVEKIT_STT_MODEL: ${LIVEKIT_STT_MODEL:-deepgram/nova-3}
      LIVEKIT_TTS_MODEL: ${LIVEKIT_TTS_MODEL:-cartesia/sonic-2}
    depends_on:
      backend:
        condition: service_healthy
    command: python agent.py start

  frontend:
    image: ${DOCKERHUB_USER}/career-copilot-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
